name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    env:
      # Placeholder connection strings. The build and tests never open a real
      # DB connection — these only keep `new PrismaPg({ connectionString })`
      # from seeing `undefined` while Next collects routes during the build.
      DATABASE_URL: postgresql://user:password@localhost:5432/db
      DIRECT_URL: postgresql://user:password@localhost:5432/db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` honours .npmrc (legacy-peer-deps) and runs the
      # `postinstall: prisma generate` script, producing app/generated/prisma.
      - name: Install dependencies
        run: npm ci

      - name: Build (next build)
        run: npm run build

      - name: Test (vitest)
        run: npm test
